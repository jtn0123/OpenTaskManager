name: OpenTaskManager
options:
  # Keep the project presets, including warnings. Target presets add a
  # BUNDLE_LOADER to unit tests, so the macOS paths below are explicit.
  settingPresets: project
  bundleIdPrefix: io.github.jtn0123
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    # Ad-hoc signing: runs locally without an Apple Developer account.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  OTMKit:
    path: Packages/OTMKit

targets:
  OpenTaskManager:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: OTMKit
        product: OTMKit
      - sdk: Carbon.framework
    entitlements:
      path: App/OpenTaskManager.entitlements
      properties:
        # A task manager has to see other processes, which the sandbox forbids.
        com.apple.security.app-sandbox: false
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: OpenTaskManager
        CFBundleName: OpenTaskManager
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Copyright © 2026 OpenTaskManager contributors. Licensed under GPL-3.0."
        NSAppleEventsUsageDescription: "OpenTaskManager asks for administrator rights only when you end or reprioritize a system process."
        # Recording files exported from the History page (OTMKit's RecordingFile): JSON, opened read-only.
        CFBundleDocumentTypes:
          - CFBundleTypeName: OpenTaskManager Recording
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [io.github.jtn0123.OpenTaskManager.recording]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: io.github.jtn0123.OpenTaskManager.recording
            UTTypeDescription: OpenTaskManager Recording
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [otmrecording]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.jtn0123.OpenTaskManager
        PRODUCT_NAME: OpenTaskManager
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: NO
        SDKROOT: macosx
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]

  OpenTaskManagerLogicTests:
    type: bundle.unit-test
    platform: macOS
    # Compile the stores themselves without an application dependency or a test host.
    sources:
      - App/Tests
      - App/Sources/Support/PageSelection.swift
      - App/Sources/Support/PagePresentation.swift
      - App/Sources/Support/LaunchArgument.swift
      - App/Sources/Support/SidebarVisibilityStore.swift
      - App/Sources/Support/MainWindowFrame.swift
      - App/Sources/SamplingDemandStore.swift
      - App/Sources/MenuBarIconStore.swift
      - App/Sources/DockIconController.swift
      - App/Sources/MiniMonitorStore.swift
      - App/Sources/RecentProcessStore.swift
      - App/Sources/UserUsageStore.swift
    dependencies:
      - package: OTMKit
        product: OTMKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SDKROOT: macosx
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks", "@loader_path/../Frameworks"]
        PRODUCT_BUNDLE_IDENTIFIER: io.github.jtn0123.OpenTaskManagerLogicTests

schemes:
  OpenTaskManager:
    build:
      targets:
        OpenTaskManager: all
    run:
      config: Debug
    archive:
      config: Release
  OpenTaskManagerLogicTests:
    build:
      targets:
        OpenTaskManagerLogicTests: all
    test:
      config: Debug
      targets:
        - OpenTaskManagerLogicTests
