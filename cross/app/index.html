<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenTaskManager</title>
  </head>
  <body>
    <header class="toolbar">
      <h1>OpenTaskManager</h1>
      <input id="search" type="search" placeholder="Search by name, PID or user" aria-label="Search processes" autocomplete="off" spellcheck="false" />
    </header>
    <section id="graphs" class="graphs" aria-label="Live graphs"></section>
    <section id="processes" class="processes" aria-label="Processes"></section>
    <footer id="status" class="statusbar" role="status"></footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
