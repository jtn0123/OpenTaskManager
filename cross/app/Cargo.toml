[package]
name = "opentaskmanager"
description = "OpenTaskManager for Windows and Linux, drawn natively with Slint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file = "../../LICENSE"
repository.workspace = true

[dependencies]
otm-core.workspace = true
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility"] }

# Windows and macOS: their own tray through tray-icon.
[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.26"

# Linux: a StatusNotifierItem over D-Bus, without loading GTK.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }

[build-dependencies]
slint-build = "1.18"
