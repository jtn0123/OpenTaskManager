[workspace]
resolver = "3"
members = ["crates/otm-core", "app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license-file = "../LICENSE"
repository = "https://github.com/jtn0123/OpenTaskManager"

[workspace.dependencies]
otm-core = { path = "crates/otm-core" }
sysinfo = "0.39"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
