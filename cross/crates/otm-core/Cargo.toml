[package]
name = "otm-core"
description = "Sampling and figures for OpenTaskManager's cross-platform app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file = "../../../LICENSE"
repository.workspace = true

[dependencies]
sysinfo.workspace = true

# Ending a process through a handle to it (actions.rs): a pidfd on Linux,
# a process handle on Windows.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
